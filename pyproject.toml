[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiquetaque-sync"
dynamic = ["version"]
description = "Monitor de jornada TiqueTaque: painel web local, notificações no Slack/Telegram e autostart com o sistema"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Gustavo Resende" }
]
keywords = ["tiquetaque", "ponto", "jornada", "clt", "slack", "telegram"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "apscheduler>=3.10.4",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pytz>=2024.1",
    "aiofiles>=23.2.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
tiquetaque-sync = "tiquetaque_sync.cli:main"

[project.gui-scripts]
# Sem janela de console: usado pelo autostart e pelo atalho da área de trabalho.
tiquetaque-syncw = "tiquetaque_sync.cli:main"
tiquetaque-sync-gui = "tiquetaque_sync.cli:main_gui"

[project.urls]
Homepage = "https://github.com/resendegu/tique-taque-sync"
Issues = "https://github.com/resendegu/tique-taque-sync/issues"

[tool.setuptools.dynamic]
# Fonte única da versão. Antes havia um literal aqui e outro no __init__.py, e
# eles divergiram na v2.1.1: o app publicado se identificava com a versão
# anterior, e o auto-updater reoferecia a mesma atualização sem parar.
version = { attr = "tiquetaque_sync.__version__" }

[tool.setuptools.packages.find]
include = ["tiquetaque_sync*"]

[tool.setuptools.package-data]
tiquetaque_sync = ["web/templates/*.html", "web/static/css/*.css", "web/static/js/*.js", "web/static/img/*", "assets/*"]
