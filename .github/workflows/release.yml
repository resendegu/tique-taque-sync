name: Release

# Caminho principal: subir `__version__` em tiquetaque_sync/__init__.py e dar push na
# main. Isso compila o executável do Windows, cria a tag `vX.Y.Z`, abre a
# release e anexa o .exe — nenhuma tag precisa ser criada à mão.
#
# Também roda ao publicar uma release manualmente (para tags criadas fora deste
# fluxo) e via workflow_dispatch, que sem tag só gera o .exe como artefato.

on:
  push:
    branches: [main]
    paths: ["tiquetaque_sync/__init__.py"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: "Tag da release onde anexar o .exe (vazio = só artefato)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Decide se este run publica uma versão e qual é a tag envolvida. Centralizar
  # aqui evita repetir a lógica dos três gatilhos em cada passo do job pesado.
  version:
    name: Versão do pacote
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      prerelease: ${{ steps.decide.outputs.prerelease || 'false' }}
      # true só no caminho do bump: aí a tag e a release ainda não existem.
      create: ${{ steps.decide.outputs.create || 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detectar alteração de versão
        id: detect
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if git show HEAD^:tiquetaque_sync/__init__.py > /tmp/previous.py 2>/dev/null; then
            python scripts/version_bump.py --current tiquetaque_sync/__init__.py --previous /tmp/previous.py
          else
            python scripts/version_bump.py --current tiquetaque_sync/__init__.py
          fi

      - name: Decidir o que este run faz
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.detect.outputs.changed }}
          VERSION: ${{ steps.detect.outputs.version }}
          PRERELEASE: ${{ steps.detect.outputs.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.upload_to_release }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push)
              # Só constrói quando a versão mudou: commit comum não vira release.
              if [ "${CHANGED:-false}" = "true" ]; then
                {
                  echo "build=true"
                  echo "create=true"
                  echo "tag=v${VERSION}"
                  echo "version=${VERSION}"
                  echo "prerelease=${PRERELEASE:-false}"
                } >> "$GITHUB_OUTPUT"
              else
                echo "build=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Versão inalterada — nenhuma release neste commit."
              fi
              ;;
            release)
              # Tag criada à mão: a release já existe, só falta o .exe.
              {
                echo "build=true"
                echo "tag=${RELEASE_TAG}"
                echo "version=${RELEASE_TAG#v}"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              {
                echo "build=true"
                echo "tag=${INPUT_TAG}"
                echo "version=${INPUT_TAG#v}"
              } >> "$GITHUB_OUTPUT"
              ;;
          esac

  windows-exe:
    name: Executável do Windows
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write # necessário para criar a release e anexar o asset

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo para o --generate-notes

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Compilar TiqueTaqueSync.exe
        run: pyinstaller packaging/tiquetaque-sync.spec --noconfirm --clean

      # O .exe precisa servir o painel a partir dos arquivos embutidos, e precisa
      # fazer isso SEM saída redirecionada — que é como ele roda ao ser clicado
      # duas vezes e ao ser iniciado pela própria janela. Não redirecione a saída
      # aqui: isso mascararia justamente essa classe de falha.
      - name: Testar o executável
        shell: pwsh
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP "ttq-smoke"
          $env:TIQUETAQUE_SYNC_HOME = $home_dir
          $log = Join-Path $home_dir "data/tiquetaque-sync.log"

          $proc = Start-Process -FilePath "dist\TiqueTaqueSync.exe" `
            -ArgumentList "start", "--no-browser", "--port", "8790" -PassThru

          function Show-Diagnostics {
            Write-Host "--- diagnóstico ---"
            if ($proc.HasExited) {
              Write-Host "Processo encerrou com código $($proc.ExitCode)"
            } else {
              Write-Host "Processo ainda vivo (PID $($proc.Id)) mas sem responder"
            }
            if (Test-Path $log) {
              Write-Host "--- $log ---"
              Get-Content $log -Tail 60
            } else {
              Write-Host "Nenhum log em $log"
            }
          }

          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8790/healthz" -TimeoutSec 5
                if ($health.status -eq "ok") { $ok = $true; break }
              } catch { }
              if ($proc.HasExited) { break }
            }
            if (-not $ok) {
              Show-Diagnostics
              throw "O executável não respondeu em /healthz"
            }

            $dashboard = Invoke-WebRequest "http://127.0.0.1:8790/" -UseBasicParsing -TimeoutSec 10
            if ($dashboard.Content -notmatch "Horas Trabalhadas Hoje") {
              Show-Diagnostics
              throw "O painel não renderizou (templates ausentes no pacote?)"
            }

            $settings = Invoke-WebRequest "http://127.0.0.1:8790/settings" -UseBasicParsing -TimeoutSec 10
            if ($settings.Content -notmatch "Quando quero ser avisado") {
              Show-Diagnostics
              throw "A tela de configurações não renderizou"
            }

            $css = Invoke-WebRequest "http://127.0.0.1:8790/static/css/settings.css" -UseBasicParsing -TimeoutSec 10
            if ($css.StatusCode -ne 200) {
              Show-Diagnostics
              throw "Arquivos estáticos ausentes no pacote"
            }

            Write-Host "Executável validado: painel, configurações e estáticos OK"
          }
          finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Process TiqueTaqueSync -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      # O modo pasta não se descompacta em %TEMP% a cada execução — que é um dos
      # gatilhos de heurística de antivírus no modo arquivo único. Publicamos os
      # dois: o .exe pela conveniência, o .zip para quem for bloqueado.
      - name: Compilar a versão em pasta
        env:
          TTQ_ONEDIR: "1"
        run: pyinstaller packaging/tiquetaque-sync.spec --noconfirm --clean --distpath dist-onedir --workpath build/onedir

      - name: Empacotar a versão em pasta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "dist-onedir\TiqueTaqueSync\TiqueTaqueSync.exe")) {
            throw "A compilação em pasta não produziu o executável"
          }
          Compress-Archive -Path "dist-onedir\TiqueTaqueSync" -DestinationPath "dist\TiqueTaqueSync-pasta.zip" -Force

      - name: Gerar checksums
        shell: pwsh
        run: |
          foreach ($file in @("TiqueTaqueSync.exe", "TiqueTaqueSync-pasta.zip")) {
            $path = "dist\$file"
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Out-File -FilePath "$path.sha256" -Encoding ascii
            Write-Host "$file  ->  $hash"
          }

      - name: Publicar como artefato da execução
        uses: actions/upload-artifact@v4
        with:
          name: TiqueTaqueSync-windows
          path: |
            dist/TiqueTaqueSync.exe
            dist/TiqueTaqueSync.exe.sha256
            dist/TiqueTaqueSync-pasta.zip
            dist/TiqueTaqueSync-pasta.zip.sha256
          if-no-files-found: error

      # Só no caminho do bump de versão: a tag e a release ainda não existem.
      # O .exe já foi compilado e testado acima, então a release nasce completa.
      - name: Criar a tag e a release
        if: needs.version.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (git tag --list $env:TAG) {
            Write-Host "::notice::A tag $env:TAG já existe — seguindo para o upload."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $env:TAG -m "Release $env:VERSION"
            git push origin $env:TAG
          }

          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::notice::A release $env:TAG já existe — as notas serão atualizadas."
          } else {
            $flags = @("--title", $env:TAG, "--generate-notes")
            if ($env:PRERELEASE -eq "true") { $flags += "--prerelease" }
            gh release create $env:TAG @flags
          }

      - name: Anexar à release
        if: needs.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$env:TAG" dist/TiqueTaqueSync.exe dist/TiqueTaqueSync.exe.sha256 dist/TiqueTaqueSync-pasta.zip dist/TiqueTaqueSync-pasta.zip.sha256 --clobber

      # Acrescenta as instruções de download e a mensagem do commit ao corpo da
      # release. O que a pessoa escreveu à mão é preservado: o bloco gerado fica
      # abaixo de um marcador e é substituído (não duplicado) a cada re-execução.
      - name: Escrever as instruções de download na release
        if: needs.version.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          $marker = "<!-- gerado automaticamente pelo workflow Release -->"

          $commitMessage = (git log -1 --pretty=%B | Out-String).Trim()
          $commitSha = (git rev-parse --short HEAD).Trim()
          $sha256 = (Get-Content dist/TiqueTaqueSync.exe.sha256 -Raw).Split(" ")[0].Trim()
          $exeUrl = "https://github.com/$env:REPO/releases/download/$env:TAG/TiqueTaqueSync.exe"
          # A tag da IMAGEM não é a tag do git: a metadata-action remove o "v"
          # de `v1.2.3` e publica `1.2.3`. Citar a tag do git aqui mandaria a
          # pessoa dar `docker run` numa tag que não existe.
          $imageTag = $env:TAG -replace '^v', ''

          $generated = @"
          $marker

          ## ⬇️ Baixar e executar (Windows)

          1. Baixe o [**TiqueTaqueSync.exe**]($exeUrl) em *Assets*, logo abaixo.
          2. Execute o arquivo — não há instalador. A janela do app abre.
          3. Clique em **Iniciar serviço** e depois em **Configurações** para informar
             seu e-mail e o código de 4 dígitos do TiqueTaque.
          4. Opcional: marque **Iniciar junto com o sistema** para ele subir sozinho no login.

          > Como o executável não é assinado digitalmente, o Windows SmartScreen avisa
          > "O Windows protegeu o computador" na primeira execução.
          > Clique em **Mais informações → Executar assim mesmo**.

          ### O antivírus bloqueou ou apagou o arquivo?

          Baixe o **TiqueTaqueSync-pasta.zip**, também em *Assets*: é o mesmo app, mas em
          formato de pasta. O `.exe` único se descompacta sozinho a cada execução, e esse
          comportamento dispara heurística de antivírus com mais frequência.

          Extraia o zip e execute o `TiqueTaqueSync.exe` de dentro da pasta — mantenha a
          pasta `_internal` ao lado dele.

          <details>
          <summary>Conferir a integridade do download</summary>

          ``````powershell
          Get-FileHash .\TiqueTaqueSync.exe -Algorithm SHA256
          ``````

          Deve bater com:

          ``````
          $sha256
          ``````
          </details>

          ## 🧰 Outras formas de instalar

          ``````bash
          # Qualquer sistema, via pip (inclui a CLI e a janela do app)
          pip install git+https://github.com/${env:REPO}.git@${env:TAG}

          # Servidor / homelab, via Docker (amd64 e arm64)
          docker run -d --name tiquetaque-sync -p 8000:8000 ghcr.io/${env:REPO}:${imageTag}
          ``````

          Instruções completas, incluindo Kubernetes, no [README](https://github.com/$env:REPO#readme).

          ## 📝 Último commit ($commitSha)

          ``````text
          $commitMessage
          ``````
          "@

          $existing = gh release view "$env:TAG" --json body --jq .body
          if ($null -eq $existing) { $existing = "" }

          # Se já rodamos antes, corta o bloco antigo e regera.
          $index = $existing.IndexOf($marker)
          if ($index -ge 0) { $existing = $existing.Substring(0, $index) }

          $body = ($existing.TrimEnd() + "`n`n" + $generated).TrimStart()
          # WriteAllText em vez de Out-File: garante UTF-8 sem BOM, que apareceria
          # como caractere solto no topo das notas.
          $notes = Join-Path (Get-Location) "release-notes.md"
          [System.IO.File]::WriteAllText($notes, $body, (New-Object System.Text.UTF8Encoding $false))

          gh release edit "$env:TAG" --notes-file $notes
          Write-Host "Notas da release atualizadas para $env:TAG"
