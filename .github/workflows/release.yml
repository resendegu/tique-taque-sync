name: Release

# Ao publicar uma release no GitHub, compila o executável do Windows e anexa
# o arquivo aos assets, para o usuário baixar e rodar sem instalar Python.
#
# Também dá para rodar manualmente (workflow_dispatch) para testar o build sem
# publicar nada: o .exe fica disponível como artefato da execução.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: "Tag da release onde anexar o .exe (vazio = só artefato)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  windows-exe:
    name: Executável do Windows
    runs-on: windows-latest
    permissions:
      contents: write # necessário para anexar o asset à release

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Compilar TiqueTaqueSync.exe
        run: pyinstaller packaging/tiquetaque-sync.spec --noconfirm --clean

      # O .exe precisa servir o painel a partir dos arquivos embutidos, e precisa
      # fazer isso SEM saída redirecionada — que é como ele roda ao ser clicado
      # duas vezes e ao ser iniciado pela própria janela. Não redirecione a saída
      # aqui: isso mascararia justamente essa classe de falha.
      - name: Testar o executável
        shell: pwsh
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP "ttq-smoke"
          $env:TIQUETAQUE_SYNC_HOME = $home_dir
          $log = Join-Path $home_dir "data/tiquetaque-sync.log"

          $proc = Start-Process -FilePath "dist\TiqueTaqueSync.exe" `
            -ArgumentList "start", "--no-browser", "--port", "8790" -PassThru

          function Show-Diagnostics {
            Write-Host "--- diagnóstico ---"
            if ($proc.HasExited) {
              Write-Host "Processo encerrou com código $($proc.ExitCode)"
            } else {
              Write-Host "Processo ainda vivo (PID $($proc.Id)) mas sem responder"
            }
            if (Test-Path $log) {
              Write-Host "--- $log ---"
              Get-Content $log -Tail 60
            } else {
              Write-Host "Nenhum log em $log"
            }
          }

          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8790/healthz" -TimeoutSec 5
                if ($health.status -eq "ok") { $ok = $true; break }
              } catch { }
              if ($proc.HasExited) { break }
            }
            if (-not $ok) {
              Show-Diagnostics
              throw "O executável não respondeu em /healthz"
            }

            $dashboard = Invoke-WebRequest "http://127.0.0.1:8790/" -UseBasicParsing -TimeoutSec 10
            if ($dashboard.Content -notmatch "Horas Trabalhadas Hoje") {
              Show-Diagnostics
              throw "O painel não renderizou (templates ausentes no pacote?)"
            }

            $settings = Invoke-WebRequest "http://127.0.0.1:8790/settings" -UseBasicParsing -TimeoutSec 10
            if ($settings.Content -notmatch "Quando quero ser avisado") {
              Show-Diagnostics
              throw "A tela de configurações não renderizou"
            }

            $css = Invoke-WebRequest "http://127.0.0.1:8790/static/css/settings.css" -UseBasicParsing -TimeoutSec 10
            if ($css.StatusCode -ne 200) {
              Show-Diagnostics
              throw "Arquivos estáticos ausentes no pacote"
            }

            Write-Host "Executável validado: painel, configurações e estáticos OK"
          }
          finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Process TiqueTaqueSync -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Gerar checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\TiqueTaqueSync.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TiqueTaqueSync.exe" | Out-File -FilePath dist\TiqueTaqueSync.exe.sha256 -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Publicar como artefato da execução
        uses: actions/upload-artifact@v4
        with:
          name: TiqueTaqueSync-windows
          path: |
            dist/TiqueTaqueSync.exe
            dist/TiqueTaqueSync.exe.sha256
          if-no-files-found: error

      - name: Anexar à release
        if: github.event_name == 'release' || inputs.upload_to_release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.upload_to_release }}
        run: gh release upload "$env:TAG" dist/TiqueTaqueSync.exe dist/TiqueTaqueSync.exe.sha256 --clobber

      # Acrescenta as instruções de download e a mensagem do commit ao corpo da
      # release. O que a pessoa escreveu à mão é preservado: o bloco gerado fica
      # abaixo de um marcador e é substituído (não duplicado) a cada re-execução.
      - name: Escrever as instruções de download na release
        if: github.event_name == 'release' || inputs.upload_to_release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.upload_to_release }}
          REPO: ${{ github.repository }}
        run: |
          $marker = "<!-- gerado automaticamente pelo workflow Release -->"

          $commitMessage = (git log -1 --pretty=%B | Out-String).Trim()
          $commitSha = (git rev-parse --short HEAD).Trim()
          $sha256 = (Get-Content dist/TiqueTaqueSync.exe.sha256 -Raw).Split(" ")[0].Trim()
          $exeUrl = "https://github.com/$env:REPO/releases/download/$env:TAG/TiqueTaqueSync.exe"

          $generated = @"
          $marker

          ## ⬇️ Baixar e executar (Windows)

          1. Baixe o [**TiqueTaqueSync.exe**]($exeUrl) em *Assets*, logo abaixo.
          2. Execute o arquivo — não há instalador. A janela do app abre.
          3. Clique em **Iniciar serviço** e depois em **Configurações** para informar
             seu e-mail e o código de 4 dígitos do TiqueTaque.
          4. Opcional: marque **Iniciar junto com o sistema** para ele subir sozinho no login.

          > Como o executável não é assinado digitalmente, o Windows SmartScreen avisa
          > "O Windows protegeu o computador" na primeira execução.
          > Clique em **Mais informações → Executar assim mesmo**.

          <details>
          <summary>Conferir a integridade do download</summary>

          ``````powershell
          Get-FileHash .\TiqueTaqueSync.exe -Algorithm SHA256
          ``````

          Deve bater com:

          ``````
          $sha256
          ``````
          </details>

          ## 🧰 Outras formas de instalar

          ``````bash
          # Qualquer sistema, via pip (inclui a CLI e a janela do app)
          pip install git+https://github.com/${env:REPO}.git@${env:TAG}

          # Servidor / homelab, via Docker (amd64 e arm64)
          docker run -d --name tiquetaque-sync -p 8000:8000 ghcr.io/${env:REPO}:${env:TAG}
          ``````

          Instruções completas, incluindo Kubernetes, no [README](https://github.com/$env:REPO#readme).

          ## 📝 Último commit ($commitSha)

          ``````text
          $commitMessage
          ``````
          "@

          $existing = gh release view "$env:TAG" --json body --jq .body
          if ($null -eq $existing) { $existing = "" }

          # Se já rodamos antes, corta o bloco antigo e regera.
          $index = $existing.IndexOf($marker)
          if ($index -ge 0) { $existing = $existing.Substring(0, $index) }

          $body = ($existing.TrimEnd() + "`n`n" + $generated).TrimStart()
          # WriteAllText em vez de Out-File: garante UTF-8 sem BOM, que apareceria
          # como caractere solto no topo das notas.
          $notes = Join-Path (Get-Location) "release-notes.md"
          [System.IO.File]::WriteAllText($notes, $body, (New-Object System.Text.UTF8Encoding $false))

          gh release edit "$env:TAG" --notes-file $notes
          Write-Host "Notas da release atualizadas para $env:TAG"
