name: Docker

# Publica a imagem multi-arquitetura no GitHub Packages (GHCR):
#   ghcr.io/resendegu/tique-taque-sync
#
# Tags geradas:
#   latest          -> último commit da branch main
#   main            -> mesma coisa, por nome de branch
#   1.2.3 / 1.2 / 1 -> quando uma tag v1.2.3 é criada
#   sha-<commit>    -> rastreabilidade de cada build
#
# Em pull requests a imagem é apenas construída (sem push), só para validar o
# Dockerfile.

on:
  push:
    branches: [main]
    # Aceita tanto `v1.2.3` quanto `1.2.3`. O filtro anterior só casava com o
    # prefixo `v`, então as tags deste repositório (2.0.1, 2.0.2) nunca
    # dispararam o build e a imagem ficou sem nenhuma tag de versão.
    tags: ["v[0-9]*", "[0-9]*"]
    paths-ignore:
      - "**.md"
      - "userscript/**"
  pull_request:
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "pyproject.toml"
      - "tiquetaque_sync/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A versão do projeto mora em [project].version do pyproject.toml. Alterar
  # aquela linha é o que declara uma release: aqui ela é comparada com o commit
  # anterior para decidir se a imagem ganha tags de versão.
  version:
    name: Versão do pyproject
    runs-on: ubuntu-latest
    outputs:
      # `|| 'false'` cobre os casos em que o passo nem roda (PR, push de tag).
      changed: ${{ steps.detect.outputs.changed || 'false' }}
      version: ${{ steps.detect.outputs.version }}
      major_minor: ${{ steps.detect.outputs.major_minor }}
      major: ${{ steps.detect.outputs.major }}
      prerelease: ${{ steps.detect.outputs.prerelease || 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # o commit atual e o anterior, para comparar a versão

      - name: Detectar alteração de versão
        id: detect
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if git show HEAD^:pyproject.toml > /tmp/previous.toml 2>/dev/null; then
            python scripts/version_bump.py --current pyproject.toml --previous /tmp/previous.toml
          else
            python scripts/version_bump.py --current pyproject.toml
          fi

  build:
    name: Build & push (amd64 + arm64)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      # QEMU é necessário para montar a camada arm64 (Raspberry Pi, Apple
      # Silicon, nós Ampere/Graviton) a partir de um runner amd64.
      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.changed == 'true' }}
            type=raw,value=${{ needs.version.outputs.major_minor }},enable=${{ needs.version.outputs.changed == 'true' && needs.version.outputs.prerelease != 'true' }}
            type=raw,value=${{ needs.version.outputs.major }},enable=${{ needs.version.outputs.changed == 'true' && needs.version.outputs.prerelease != 'true' }}
          labels: |
            org.opencontainers.image.title=TiqueTaque Sync
            org.opencontainers.image.description=Monitor de jornada TiqueTaque com painel web e notificações no Slack/Telegram
            org.opencontainers.image.licenses=MIT

      - name: Build e push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Permite que quem baixa a imagem verifique que ela saiu deste repositório:
      #   gh attestation verify oci://ghcr.io/resendegu/tique-taque-sync:latest \
      #     --repo resendegu/tique-taque-sync
      - name: Gerar atestado de proveniência
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Resumo do build
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Imagem publicada :whale:"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
