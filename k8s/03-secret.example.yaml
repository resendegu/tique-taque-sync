apiVersion: v1
kind: Secret
metadata:
  name: tique-taque-sync-secrets
  namespace: tique-taque-sync
  labels:
    app.kubernetes.io/name: tique-taque-sync
type: Opaque
stringData:
  # ============================================================================
  # Credenciais TiqueTaque (Obrigatório)
  # ============================================================================
  TIQUETAQUE_EMAIL: "seu-email@empresa.com.br"
  TIQUETAQUE_CODE: "1234"
  # Opcionais (obtidos automaticamente após primeiro login)
  # TIQUETAQUE_TOKEN: ""
  # TIQUETAQUE_EMPLOYEE_ID: ""
  # TIQUETAQUE_FULL_NAME: ""

  # ============================================================================
  # Notificações no Telegram (Opcional)
  # ============================================================================
  TELEGRAM_ENABLED: "false"
  TELEGRAM_BOT_TOKEN: "123456789:SEU-TOKEN-DO-BOTFATHER"
  TELEGRAM_CHAT_ID: "123456789"

  # ============================================================================
  # Notificações no Slack (Opcional)
  # ============================================================================
  SLACK_ENABLED: "false"
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/SEU-WORKSPACE-ID/SEU-CANAL-ID/SEU-TOKEN"

  # ============================================================================
  # Segredo da API Interna
  # ============================================================================
  API_SECRET_KEY: "substitua-por-uma-chave-secreta-aleatoria"
